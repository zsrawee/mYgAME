<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parkour Platformer - لعبة باركور</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="rotate-overlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">دوّر جوالك للعرض</div>
    </div>

    <!-- تم إضافة dir="ltr" هنا لعزل اتجاه اللعبة عن اتجاه الصفحة -->
    <div id="game-container" dir="ltr"></div>
    
    <div id="controls">
        <span>← →</span> حركة 
        <span>↑ / Space</span> قفز 
        <span>W</span> جدار 
        <span>Shift</span> داش
        <span>R</span> إعادة 
        <span>M</span> قائمة
    </div>

    <script src="js/levels.js"></script>
    <script src="js/scenes/boot.js"></script>
    <script src="js/scenes/menu.js"></script>
    <script src="js/scenes/game.js"></script>
    <script src="js/config.js"></script>
</body>
</html>
