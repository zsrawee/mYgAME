<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parkour Platformer - لعبة باركور</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container" dir="ltr">
        <div id="ui-overlay">
            <div id="level-name" class="ui-text"></div>
            <div id="death-count" class="ui-text"></div>
            <div id="hint-text" class="ui-text"></div>
            <div id="touch-controls">
                <button id="btn-left" class="touch-btn">←</button>
                <button id="btn-right" class="touch-btn">→</button>
                <button id="btn-jump" class="touch-btn">JUMP</button>
                <button id="btn-dash" class="touch-btn">DASH</button>
            </div>
            <button id="room-enter-btn">ENTER</button>
            <div id="orientation-overlay">
                <div class="icon">📱</div>
                <div class="msg">دوّر جوالك للعرض</div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
